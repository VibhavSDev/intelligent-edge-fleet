version: '3.8'

services:
  redis-cache:
    image: redis:7.2-alpine
    container_name: fleet_redis_cache
    command: redis-server --port 6337 --loglevel warning
    ports:
      - "6337:6337"
    volumes:
      - redis_data:/data
    restart: always

  postgres-db:
    image: postgis/postgis:15-3.3-alpine
    container_name: fleet_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fleet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  redis_data:
  postgres_data: